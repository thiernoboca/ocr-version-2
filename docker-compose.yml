version: '3.8'

services:
  # Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: ocr_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ocr_documents
      MYSQL_USER: ocr_user
      MYSQL_PASSWORD: ocr_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - ocr_network

  # Backend PHP avec Apache
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr_backend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage:/var/www/html/storage
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=ocr_documents
      - DB_USERNAME=ocr_user
      - DB_PASSWORD=ocr_password
    depends_on:
      - mysql
    networks:
      - ocr_network

  # Frontend Node.js (développement)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocr_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080/api
    networks:
      - ocr_network

  # PhpMyAdmin (optionnel, pour gérer la base de données)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ocr_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ocr_user
      PMA_PASSWORD: ocr_password
    depends_on:
      - mysql
    networks:
      - ocr_network

volumes:
  mysql_data:

networks:
  ocr_network:
    driver: bridge
